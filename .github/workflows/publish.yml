name: publish

permissions:
  contents: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: np version type (patch/minor/major)
        required: true
        default: patch
      distTag:
        description: npm dist-tag (latest,next,canary)
        required: false
        default: latest

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Upgrade npm for trusted publishing
        run: |
          # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.x
          npm install -g npm@latest
          npm --version
      - name: Install deps
        run: pnpm install --no-frozen-lockfile
      - name: Publish with np over npm trusted publishing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Auth comes from the OIDC exchange npm performs at publish time.
          # npm allows a single trusted publisher per package, so this workflow
          # only authenticates if publish.yml is the filename registered on npm.
          if [ "${{ inputs.distTag }}" != "latest" ]; then TAG_ARGS="--tag ${{ inputs.distTag }}"; fi
          npx np "${{ inputs.version }}" --no-tests --any-branch --yolo --message "Release %s" --provenance $TAG_ARGS
